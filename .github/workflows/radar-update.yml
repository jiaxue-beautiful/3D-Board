name: 3D Radar daily update
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

concurrency:
  group: radar-daily-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore last published data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/publish_data.py --restore
      - name: Collect source updates
        run: python scripts/collect.py
      - name: Prepare source news without model dependency
        run: python scripts/briefs.py
      - name: Prepare digest
        id: analysis
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_DAILY_BUDGET_USD: ${{ secrets.LLM_DAILY_BUDGET_USD }}
        run: python scripts/digest.py --now "$(python -c 'from pathlib import Path; import json; print(json.loads(Path(".work/source-records.json").read_text())["checkedAt"])')" --confirm-model-usage --cloud-budget
      - name: Publish updated data with unchanged page template
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ "${{ steps.analysis.outcome }}" != "success" ]; then
            python - <<'PY'
          from pathlib import Path
          import json
          from scripts.collect import atomic_json
          path = Path('data/digest.json')
          data = json.loads(path.read_text())
          data['processing'] = {'status': 'failed', 'pendingCount': len(data.get('pending', []))}
          atomic_json(path, data)
          PY
          fi
          python scripts/build.py --root . --out dist
          npx --yes wrangler@4.130.0 pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA"
      - name: Publish independent data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RADAR_DATA_BRANCH: radar-state
        run: |
          python scripts/publish_data.py
      - name: Report source publication and optional analysis separately
        env:
          ANALYSIS_STEP: ${{ steps.analysis.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('data/digest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Source publication\n' + json.dumps(data['sourceProcessing']) + '\n')
              summary.write('## Optional AI analysis\n' + json.dumps(data.get('processing', {})) + '\n')
          failures = {'generation_failed', 'invalid_draft', 'budget_blocked'}
          if os.environ['ANALYSIS_STEP'] != 'success' or any(row['status'] in failures for row in data.get('outcomes', [])):
              print('::warning::Source news published. AI analysis remains incomplete; budget protection is unchanged.')
          PY
